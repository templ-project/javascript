[project]
name = "javascript-template-docs"
version = "1.0.0"
description = "Documentation for JavaScript template project"
authors = [{ name = "Templ Project" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["docs"]

[project.optional-dependencies]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.5.0", "mkdocstrings>=0.24.0", "mkdocstrings-typescript>=0.1.0"]

[dependency-groups]
dev = ["mkdocs>=1.5.0", "mkdocs-material>=9.5.0", "mkdocstrings>=0.24.0", "mkdocstrings-typescript>=0.1.0"]
